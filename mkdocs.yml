site_name: protondl Documentation
site_description: |
  Documentation of the protondl library.
  Modern, headless, and async-first Python library and CLI for managing Steam & Linux gaming compatibility tools.

site_url: https://davidotek.github.io/protondl
repo_url: https://github.com/DavidoTek/protondl
repo_name: DavidoTek/protondl

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.instant
    - navigation.instant.prefetch
    - toc.follow
    - toc.integrate 
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

plugins:
  - optimize
  - privacy
  - tags

extra_css:
  - stylesheets/launcher_badges.css

plugins:
  - search
  - optimize
  - privacy
  - tags
